specVersion: 1.3.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: ProofPoolHook
    network: sepolia
    source:
      address: "0xA98F33C701F0D206e3f940810e2135d930fc8080"
      abi: ProofPoolHook
      startBlock: 11349795
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pool
        - Swap
        - Swapper
        - SwapRecord
        - TransactionPoolCursor
      abis:
        - name: ProofPoolHook
          file: ./abis/ProofPoolHook.json
      eventHandlers:
        - event: SwapPriced(indexed bytes32,indexed address,bool,uint24,bool,int256,bytes32)
          handler: handleSwapPriced
      file: ./src/hook.ts

  - kind: ethereum/contract
    name: ProofPoolRouter
    network: sepolia
    source:
      address: "0x60a058a835da19Ba8db84602b3474d999985B76F"
      abi: ProofPoolRouter
      startBlock: 11349795
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Pool
        - Swap
        - TransactionPoolCursor
      abis:
        - name: ProofPoolRouter
          file: ./abis/ProofPoolRouter.json
      eventHandlers:
        - event: SwapExecuted(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleSwapExecuted
      file: ./src/router.ts

  - kind: ethereum/contract
    name: Registry
    network: sepolia
    source:
      address: "0xA8B46486c2AC0Cec419b3e205aAd9AaC4c33C7D4"
      abi: Registry
      startBlock: 11349795
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - DiscountedSwapUse
        - SwapRecord
        - RegistryConfig
      abis:
        - name: Registry
          file: ./abis/Registry.json
      eventHandlers:
        - event: DiscountedSwapRecorded(indexed bytes32,uint256)
          handler: handleSwapRecorded
        - event: HookUpdated(indexed address,indexed address)
          handler: handleHookUpdated
        - event: MaxSwapsUpdated(uint256,uint256)
          handler: handleMaxSwapsUpdated
      file: ./src/registry.ts
