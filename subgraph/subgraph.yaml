specVersion: 1.3.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: ProofPoolHook
    network: sepolia
    source:
      address: "0xa12E7664e24A3444330712c13Bed43840F9C8080"
      abi: ProofPoolHook
      startBlock: 11348716
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Swap
        - Swapper
      abis:
        - name: ProofPoolHook
          file: ./abis/ProofPoolHook.json
      eventHandlers:
        - event: SwapPriced(indexed address,bool,uint24,int256)
          handler: handleSwapPriced
      file: ./src/hook.ts

  - kind: ethereum/contract
    name: ProofPoolRouter
    network: sepolia
    source:
      address: "0x21590E34584D9478fBb3a5aFcB7bd4D0075B33F8"
      abi: ProofPoolRouter
      startBlock: 11348716
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Swap
      abis:
        - name: ProofPoolRouter
          file: ./abis/ProofPoolRouter.json
      eventHandlers:
        - event: SwapExecuted(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleSwapExecuted
          receipt: true
      file: ./src/router.ts

  - kind: ethereum/contract
    name: Registry
    network: sepolia
    source:
      address: "0x70B27D4b26E1995fd6ebeeC96cCb05d07D317a42"
      abi: Registry
      startBlock: 11348716
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - SwapRecord
        - RegistryConfig
      abis:
        - name: Registry
          file: ./abis/Registry.json
      eventHandlers:
        - event: DiscountedSwapRecorded(indexed bytes32,uint256)
          handler: handleSwapRecorded
        - event: HookUpdated(indexed address,indexed address)
          handler: handleHookUpdated
        - event: MaxSwapsUpdated(uint256,uint256)
          handler: handleMaxSwapsUpdated
      file: ./src/registry.ts
